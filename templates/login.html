{% extends "base.html" %}
{% block content %}
<h2>Log in</h2>
<form method="POST">
  <label>Email</label>
  <input type="email" name="email" required>
  <label>Password</label>
  <input type="password" name="password" required>
  <button type="submit">Log in</button>
</form>
<p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
